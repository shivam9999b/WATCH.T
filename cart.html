
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0b">
  <title>Shopping Cart | WATCH.T</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body { background:#f7f6f3; }

    .cart-page {
      max-width:1000px;
      margin:40px auto;
      padding:20px;
    }

    .cart-layout {
      display:grid;
      grid-template-columns:1.6fr 1fr;
      gap:25px;
      align-items:start;
    }

    .cart-box {
      padding:24px;
      background:white;
      border:1px solid #e5e0d6;
    }

    .cart-box h2 {
      font-family:Georgia,serif;
      margin-top:0;
    }

    .cart-product {
      display:grid;
      grid-template-columns:85px 1fr;
      gap:15px;
      padding:18px 0;
      border-bottom:1px solid #eee;
    }

    .cart-product img {
      width:85px;
      height:95px;
      object-fit:cover;
      background:#eee;
    }

    .cart-product h3 {
      margin:0 0 8px;
      font-size:15px;
    }

    .cart-product p {
      margin:5px 0;
      font-size:13px;
    }

    .quantity {
      display:flex;
      align-items:center;
      gap:12px;
      margin-top:12px;
    }

    .quantity button {
      width:30px;
      height:30px;
      border:1px solid #ddd;
      background:white;
    }

    .remove {
      border:0;
      background:none;
      color:#a33;
      margin-top:8px;
      padding:0;
      font-size:12px;
    }

    .summary-row {
      display:flex;
      justify-content:space-between;
      gap:15px;
      padding:13px 0;
      border-bottom:1px solid #eee;
      font-size:14px;
    }

    .summary-total {
      font-size:18px;
      font-weight:bold;
    }

    .checkout-button {
      display:block;
      width:100%;
      text-align:center;
      margin-top:20px;
    }

    .empty-cart {
      padding:35px 10px;
      text-align:center;
      color:#777;
    }

    .empty-cart a {
      display:inline-block;
      margin-top:12px;
      color:#805b20;
      font-weight:bold;
    }

    .cart-note {
      color:#777;
      font-size:12px;
      line-height:1.6;
      margin-top:15px;
    }

    @media(max-width:700px) {
      .cart-layout { grid-template-columns:1fr; }
      .cart-page { margin:20px auto; padding:12px; }
      .cart-box { padding:17px; }
    }
  </style>
</head>

<body>
  <header class="header">
    <a class="logo" href="index.html">WATCH<span>.T</span></a>
    <a href="index.html" style="color:white">← Continue Shopping</a>
  </header>

  <main class="cart-page">
    <p class="eyebrow">YOUR SELECTION</p>
    <h1>Shopping Cart</h1>

    <div class="cart-layout">
      <section class="cart-box">
        <h2>Your Products (<span id="itemCount">0</span>)</h2>
        <div id="cartProducts"></div>
      </section>

      <aside class="cart-box">
        <h2>Order Summary</h2>

        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotal">₹0</span>
        </div>

        <div class="summary-row">
          <span>Shipping</span>
          <span id="shipping">Calculated at checkout</span>
        </div>

        <div class="summary-row summary-total">
          <span>Total</span>
          <span id="total">₹0</span>
        </div>

        <a href="checkout.html"
           id="checkoutLink"
           class="gold-btn checkout-button">
          PROCEED TO CHECKOUT →
        </a>

        <p class="cart-note">
          This cart is stored on this device. The checkout and payment
          system must be connected before accepting real orders.
        </p>
      </aside>
    </div>
  </main>

  <script>
    const productsEl = document.getElementById("cartProducts");

    const money = amount =>
      new Intl.NumberFormat("en-IN", {
        style:"currency",
        currency:"INR",
        maximumFractionDigits:0
      }).format(amount);

    function readCart() {
      try {
        const saved = JSON.parse(
          localStorage.getItem("allWatchCart") || "[]"
        );

        if (!Array.isArray(saved)) return [];

        return saved.filter(item =>
          Number.isFinite(Number(item.id)) &&
          typeof item.name === "string" &&
          Number.isFinite(Number(item.price)) &&
          Number(item.price) >= 0 &&
          Number.isInteger(Number(item.quantity)) &&
          Number(item.quantity) > 0
        );
      } catch {
        return [];
      }
    }

    let cart = readCart();

    function saveCart() {
      localStorage.setItem("allWatchCart", JSON.stringify(cart));
    }

    function renderCart() {
      const count = cart.reduce(
        (sum, item) => sum + item.quantity, 0
      );

      const subtotal = cart.reduce(
        (sum, item) => sum + item.price * item.quantity, 0
      );

      document.getElementById("itemCount").textContent = count;
      document.getElementById("subtotal").textContent = money(subtotal);
      document.getElementById("total").textContent = money(subtotal);

      document.getElementById("shipping").textContent =
        count ? "At checkout" : "—";

      document.getElementById("checkoutLink").style.opacity =
        count ? "1" : ".5";

      if (!cart.length) {
        productsEl.innerHTML = `
          <div class="empty-cart">
            <h3>Your cart is empty</h3>
            <p>Find your favourite watch and add it here.</p>
            <a href="index.html#products">EXPLORE PRODUCTS →</a>
          </div>
        `;
        return;
      }

      productsEl.innerHTML = cart.map(item => `
        <article class="cart-product">
          <img src="${item.image || ""}" alt="">
          <div>
            <h3>${escapeHTML(item.name)}</h3>
            <p>${money(Number(item.price))}</p>

            <div class="quantity">
              <button data-action="minus" data-id="${item.id}"
                aria-label="Decrease quantity">−</button>

              <span>${item.quantity}</span>

              <button data-action="plus" data-id="${item.id}"
                aria-label="Increase quantity">+</button>
            </div>

            <button class="remove" data-action="remove"
              data-id="${item.id}">Remove</button>
          </div>
        </article>
      `).join("");
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[char]));
    }

    productsEl.addEventListener("click", event => {
      const button = event.target.closest("[data-action]");
      if (!button) return;

      const id = Number(button.dataset.id);
      const action = button.dataset.action;
      const item = cart.find(product => Number(product.id) === id);

      if (!item) return;

      if (action === "plus") item.quantity++;
      if (action === "minus") item.quantity--;

      if (action === "remove" || item.quantity <= 0) {
        cart = cart.filter(product => Number(product.id) !== id);
      }

      saveCart();
      renderCart();
    });

    document.getElementById("checkoutLink").addEventListener(
      "click", event => {
        if (!cart.length) {
          event.preventDefault();
          alert("Your cart is empty. Please add a product first.");
        }
      }
    );

    renderCart();
  </script>
</body>
</html>
