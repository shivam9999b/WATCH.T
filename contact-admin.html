<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#111827">
<title>Contact Messages Admin | WATCH.T</title><link rel="stylesheet" href="style.css">
<style>
:root{--navy:#111827;--gold:#d6b56d;--bg:#f5f7fb;--text:#202938;--muted:#6b7280;--border:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;line-height:1.5}header{background:var(--navy);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header a{color:#fff;text-decoration:none;font-weight:bold}.brand{font-size:21px}.brand span{color:var(--gold)}main{max-width:1150px;margin:28px auto;padding:0 16px 40px}.panel{background:#fff;border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 5px 20px rgba(0,0,0,.04)}h1{margin:0 0 8px;font-size:28px}h2{margin:0 0 14px;font-size:20px}.muted{color:var(--muted);font-size:14px}label{display:block;font-size:14px;font-weight:bold;margin:12px 0 6px}input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;font:inherit}button,.btn{border:0;border-radius:8px;background:var(--navy);color:#fff;padding:11px 15px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}button:hover,.btn:hover{background:#26364f}button:disabled{opacity:.6;cursor:not-allowed}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}.toolbar input{max-width:420px;flex:1}#status{margin-top:12px;overflow-wrap:anywhere}.error{color:#b42318}.success{color:#15803d}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--border);vertical-align:top;font-size:14px}th{background:#f9fafb;color:#374151;white-space:nowrap}td.message{white-space:pre-wrap;min-width:240px;max-width:420px;overflow-wrap:anywhere}.email{overflow-wrap:anywhere}.hidden{display:none!important}.empty{padding:24px;text-align:center;color:var(--muted)}@media(max-width:600px){main{margin:18px auto}.panel{padding:16px}h1{font-size:24px}}
</style></head>
<body><header><a class="brand" href="index.html">WATCH<span>.T</span> · Admin</a><a href="index.html">← View Store</a></header>
<main><section class="panel"><h1>Contact Messages</h1><p class="muted">Sign in with your existing All Watch admin account to view messages submitted through contact.html.</p>
<div id="loginBox"><form id="loginForm"><label for="email">Admin Email</label><input id="email" type="email" autocomplete="username" required placeholder="admin@example.com"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Admin password"><div class="toolbar"><button id="loginButton" type="submit">Sign In</button></div></form></div>
<div id="adminBox" class="hidden"><div class="toolbar"><span id="signedInAs" class="muted"></span><button id="refreshButton" type="button">Refresh Messages</button><button id="logoutButton" type="button">Logout</button></div></div><p id="status" class="muted" role="status" aria-live="polite"></p></section>
<section id="messagesPanel" class="panel hidden"><h2>Inbox <span id="count" class="muted"></span></h2><div class="toolbar"><input id="search" type="search" placeholder="Search name, email, subject or message..." aria-label="Search messages"></div><div id="messagesContainer"><p class="empty">Loading messages…</p></div></section></main>
<script type="module">
import { supabase, supabaseConfigured, escapeHTML } from "./supabase.js";
const $=id=>document.getElementById(id);let messages=[];
function status(text,kind="muted"){ $("status").textContent=text;$("status").className=kind; }
function dateText(v){if(!v)return "—";const d=new Date(v);return Number.isNaN(d.getTime())?"—":d.toLocaleString("en-IN");}
function safe(v){return escapeHTML(String(v??""));}
async function verifyAdmin(user){const {data,error}=await supabase.from("profiles").select("role").eq("id",user.id).maybeSingle();if(error)throw new Error("Admin role check failed: "+error.message);if(data?.role!=="admin")throw new Error("This account does not have the admin role in profiles.role.");}
async function loadMessages(){status("Loading contact messages…");$("messagesContainer").innerHTML='<p class="empty">Loading messages…</p>';const {data,error}=await supabase.from("contact_messages").select("id,name,email,subject,message,created_at").order("created_at",{ascending:false});if(error){console.error(error);$("messagesContainer").innerHTML="";status("Could not load messages: "+error.message+". Check contact_messages table permissions/RLS.","error");return;}messages=data||[];renderMessages();status(`${messages.length} message(s) loaded.`,"success");}
function renderMessages(){const q=$("search").value.trim().toLowerCase();const filtered=messages.filter(m=>[m.name,m.email,m.subject,m.message].some(v=>String(v??"").toLowerCase().includes(q)));$("count").textContent=`(${filtered.length})`;if(!filtered.length){$("messagesContainer").innerHTML='<p class="empty">No matching messages found.</p>';return;}$("messagesContainer").innerHTML=`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Name / Email</th><th>Subject</th><th>Message</th><th>Message ID</th></tr></thead><tbody>${filtered.map(m=>`<tr><td>${safe(dateText(m.created_at))}</td><td><strong>${safe(m.name)}</strong><br><a class="email" href="mailto:${encodeURIComponent(String(m.email??""))}">${safe(m.email)}</a></td><td>${safe(m.subject)}</td><td class="message">${safe(m.message)}</td><td>${safe(m.id)}</td></tr>`).join("")}</tbody></table></div>`;}
async function showAdmin(user){await verifyAdmin(user);$("loginBox").classList.add("hidden");$("adminBox").classList.remove("hidden");$("messagesPanel").classList.remove("hidden");$("signedInAs").textContent="Signed in: "+user.email;await loadMessages();}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();if(!supabaseConfigured){status("Supabase is not configured. Check supabase.js project URL and public key.","error");return;}$("loginButton").disabled=true;status("Signing in…");try{const {error}=await supabase.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error)throw error;const {data:{user},error:userError}=await supabase.auth.getUser();if(userError||!user)throw userError||new Error("Could not get signed-in user.");await showAdmin(user);}catch(err){console.error(err);await supabase.auth.signOut();status(err.message||"Sign in failed.","error");}finally{$("loginButton").disabled=false;}});
$("refreshButton").addEventListener("click",()=>loadMessages().catch(e=>status(e.message,"error")));$("logoutButton").addEventListener("click",async()=>{await supabase.auth.signOut();messages=[];$("adminBox").classList.add("hidden");$("messagesPanel").classList.add("hidden");$("loginBox").classList.remove("hidden");status("You have been signed out.");});$("search").addEventListener("input",renderMessages);
async function init(){if(!supabaseConfigured){status("Supabase is not configured. Check supabase.js.","error");return;}try{const {data:{user}}=await supabase.auth.getUser();if(user)await showAdmin(user);}catch(err){console.error(err);status(err.message||"Please sign in with an admin account.","error");}}init();
</script></body></html>
